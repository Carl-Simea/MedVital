<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedVital mission record</title>
<!-- Chart.js draws the line charts. No build step: a copy ships in vendor/ so the demo works offline. -->
<script src="/vendor/chart.umd.js"></script>
<style>
  :root {
    --page: #f3f4f6;
    --panel: #ffffff;
    --ink: #111418;
    --ink-soft: #4b5563;
    --line: #dfe3e8;
    --up: #0a7d33;          /* link up */
    --down: #c62828;        /* link down */
    --return-now: #c62828;  /* RETURN_NOW   = red    */
    --check-vitals: #e07000;/* CHECK_VITALS = orange */
    --info: #1f6fd0;        /* INFO         = blue   */
    --heart: #2a78d6;       /* chart lines */
    --oxygen: #1baf7a;
    --dose: #6250d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 14px 24px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px;
  }
  .title h1 { margin: 0; font-size: 22px; }
  .title p { margin: 2px 0 0; color: var(--ink-soft); font-size: 15px; }

  .link { display: flex; align-items: center; gap: 14px; }
  .link-status { font-size: 20px; font-weight: 700; }
  .link-status.up { color: var(--up); }
  .link-status.down { color: var(--down); }
  .link-button {
    font: inherit; font-size: 20px; font-weight: 700;
    padding: 14px 28px; min-width: 210px;
    border: 0; border-radius: 10px; color: #fff; cursor: pointer;
  }
  .link-button.cut { background: var(--down); }       /* link is up: the button cuts it */
  .link-button.restore { background: var(--up); }     /* link is down: the button restores it */
  .link-button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .link-button:disabled { opacity: 0.5; cursor: default; }

  .counts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-left: auto; }
  .count .number { font-size: 26px; font-weight: 700; display: block; }
  .count .label { color: var(--ink-soft); font-size: 14px; }
  .count.total .number { font-size: 34px; }

  .notice {
    margin: 16px 24px 0; padding: 12px 16px; border-radius: 8px;
    background: #fff4e5; border: 1px solid #f0c98a;
  }
  .hidden { display: none; }

  /* ---------- one panel per astronaut ---------- */
  .astronauts {
    padding: 20px 24px 40px;
    display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
  }
  .astronaut { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .astronaut-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .astronaut-head h2 { margin: 0; font-size: 24px; }
  .dose { text-align: right; }
  .dose .number { font-size: 32px; font-weight: 700; }
  .dose .label { display: block; color: var(--ink-soft); font-size: 14px; }
  .astronaut h3 { margin: 22px 0 8px; font-size: 17px; }
  .chart-box { position: relative; height: 380px; }
  .empty { color: var(--ink-soft); margin: 0; }

  .list { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; }
  .list li { padding: 10px 12px; margin-bottom: 6px; border-radius: 6px; background: #f7f8fa; border-left: 8px solid var(--line); }
  .list .when { color: var(--ink-soft); font-size: 14px; }
  .alert .code { font-weight: 700; margin-right: 10px; }
  .alert.RETURN_NOW { border-left-color: var(--return-now); background: #fdecec; }
  .alert.RETURN_NOW .code { color: var(--return-now); }
  .alert.CHECK_VITALS { border-left-color: var(--check-vitals); background: #fff1e0; }
  .alert.CHECK_VITALS .code { color: #a85400; }
  .alert.INFO { border-left-color: var(--info); background: #e9f2fd; }
  .alert.INFO .code { color: var(--info); }

  @media (max-width: 560px) {
    .astronauts { grid-template-columns: 1fr; padding: 16px 12px 32px; }
    .counts { margin-left: 0; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="title">
    <h1>MedVital mission record</h1>
    <p>NASA flight surgeon's view</p>
  </div>

  <div class="link">
    <span id="link-status" class="link-status">Link to spacecraft: …</span>
    <button id="link-button" class="link-button" disabled>…</button>
  </div>

  <div id="counts" class="counts"></div>
</header>

<p id="notice" class="notice hidden"></p>

<main id="astronauts" class="astronauts"></main>

<script>
// ---------------------------------------------------------------------------
// MedVital mission record screen.
// Every few seconds it asks the NASA receiver for /link, /stats and /records
// and redraws. Plain JavaScript, no build step.
// ---------------------------------------------------------------------------
const REFRESH_MS = 3000;

let linkUp = null;        // last known link state
let busy = false;         // true while a refresh is running
const panels = {};        // astronaut id -> the panel we built for that astronaut

// ---------- small helpers ----------
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;   // textContent: record text can never inject HTML
  return node;
}

function formatWhen(t) {
  return new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function formatClock(t) {
  return new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

async function getJson(path) {
  const response = await fetch(path, { cache: "no-store" });
  if (!response.ok) throw new Error(path + " answered " + response.status);
  return response.json();
}

function showNotice(text) {
  const notice = document.getElementById("notice");
  notice.textContent = text || "";
  notice.classList.toggle("hidden", !text);
}

// ---------- top bar ----------
function drawLink(up) {
  linkUp = up;
  const status = document.getElementById("link-status");
  const button = document.getElementById("link-button");
  status.textContent = up ? "Link to spacecraft: UP" : "Link to spacecraft: DOWN";
  status.className = "link-status " + (up ? "up" : "down");
  button.textContent = up ? "Cut the link" : "Restore the link";
  button.className = "link-button " + (up ? "cut" : "restore");
  button.disabled = false;
}

// The big toggle: POST /link with the opposite of the current state.
document.getElementById("link-button").addEventListener("click", async () => {
  if (linkUp === null) return;
  const button = document.getElementById("link-button");
  button.disabled = true;
  try {
    const response = await fetch("/link", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ up: !linkUp }),
    });
    drawLink((await response.json()).up);
  } catch (error) {
    showNotice("Could not change the link. Is the NASA receiver (python start.py) still running?");
    button.disabled = false;
  }
});

function drawCounts(stats) {
  const box = document.getElementById("counts");
  box.replaceChildren();
  const add = (number, label, extraClass) => {
    const item = el("div", "count" + (extraClass ? " " + extraClass : ""));
    item.append(el("span", "number", String(number)), el("span", "label", label));
    box.append(item);
  };
  add(stats.total, "records saved", "total");
  for (const type of Object.keys(stats.by_type).sort()) add(stats.by_type[type], "type: " + type);
  for (const id of Object.keys(stats.by_astronaut).sort()) add(stats.by_astronaut[id], "astronaut: " + id);
}

// ---------- charts ----------
// Round clock steps for the time axis (1 s ... 1 day), so labels read 14:30:00, not 14:28:20.
const TIME_STEPS_MS = [1, 5, 10, 30, 60, 300, 600, 1800, 3600, 10800, 21600, 86400].map((s) => s * 1000);

function roundTimeTicks(axis) {
  const span = axis.max - axis.min;
  const step = TIME_STEPS_MS.find((s) => span / s <= 8) || TIME_STEPS_MS[TIME_STEPS_MS.length - 1];
  const ticks = [];
  for (let t = Math.ceil(axis.min / step) * step; t <= axis.max; t += step) ticks.push({ value: t });
  axis.ticks = ticks;
}

function css(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// One chart per astronaut with three lines. Each line has its own band and its
// own scale (bpm, %, mSv), stacked on one shared time axis, so no line is
// squashed by another one's scale.
function makeChart(canvas) {
  const line = (label, color, axis) => ({
    label, yAxisID: axis, data: [],
    borderColor: color, backgroundColor: color,
    borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0,
  });
  const band = (title) => ({
    stack: "bands", offset: true,
    title: { display: true, text: title },
    ticks: { maxTicksLimit: 4 },
    grid: { color: css("--line") },
  });
  return new Chart(canvas, {
    type: "line",
    data: {
      datasets: [
        line("Heart rate (bpm)", css("--heart"), "heart"),
        line("Blood oxygen (%)", css("--oxygen"), "oxygen"),
        line("Total radiation dose (mSv)", css("--dose"), "dose"),
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: false, parsing: false, normalized: true,
      interaction: { mode: "index", intersect: false },   // hover anywhere: one tooltip with all three values
      scales: {
        x: {
          type: "linear",
          afterBuildTicks: roundTimeTicks,
          ticks: { callback: (value) => formatClock(value), maxRotation: 0 },
          grid: { display: false },
        },
        // Bands stack from the bottom up, so the last one listed is drawn on top.
        dose: band("Total dose (mSv)"),
        oxygen: band("Blood oxygen (%)"),
        heart: band("Heart rate (bpm)"),
      },
      plugins: {
        legend: { position: "bottom", labels: { boxWidth: 14, boxHeight: 3 } },
        tooltip: { callbacks: { title: (items) => (items.length ? formatWhen(items[0].parsed.x) : "") } },
      },
    },
  });
}

// ---------- astronaut panels ----------
function makePanel(id) {
  const section = el("section", "astronaut");

  const head = el("div", "astronaut-head");
  const dose = el("div", "dose");
  const doseNumber = el("span", "number", "–");
  dose.append(doseNumber, el("span", "label", "total radiation dose"));
  head.append(el("h2", "", "Astronaut " + id), dose);

  const chartTitle = el("h3", "", "Whole mission: heart rate, blood oxygen, total radiation dose");
  const chartBox = el("div", "chart-box");
  const canvas = el("canvas");
  chartBox.append(canvas);

  const alertsTitle = el("h3", "", "Alert history");
  const alerts = el("ul", "list");
  const summariesTitle = el("h3", "", "Daily summaries");
  const summaries = el("ul", "list");
  const labsTitle = el("h3", "", "Onboard lab results (bone loss)");
  const labs = el("ul", "list");
  const flagged = el("p", "empty", "");

  section.append(head, chartTitle, chartBox, flagged, alertsTitle, alerts, summariesTitle, summaries, labsTitle, labs);

  let chart = null;
  if (window.Chart) chart = makeChart(canvas);
  else chartBox.replaceChildren(el("p", "empty", "The chart library did not load (no internet?). Everything else on this page still works."));

  return { section, doseNumber, chart, alerts, summaries, alertsTitle, summariesTitle, labs, labsTitle, flagged };
}

function drawAstronaut(panel, astronaut) {
  // total radiation dose
  panel.doseNumber.textContent = astronaut.totalDose === null ? "–" : astronaut.totalDose.toFixed(2) + " mSv";

  // chart: one {x, y} point per reading, oldest first
  if (panel.chart) {
    const points = (field) => astronaut.readings.filter((r) => r[field] !== null).map((r) => ({ x: r.t, y: r[field] }));
    panel.chart.data.datasets[0].data = points("heartRate");
    panel.chart.data.datasets[1].data = points("spo2");
    panel.chart.data.datasets[2].data = points("totalDose");
    panel.chart.update("none");
  }

  // alert history, newest first, colour-coded by code
  panel.alertsTitle.textContent = "Alert history (" + astronaut.alerts.length + ")";
  panel.alerts.replaceChildren(...astronaut.alerts.map((alert) => {
    const item = el("li", "alert " + (["RETURN_NOW", "CHECK_VITALS", "INFO"].includes(alert.code) ? alert.code : ""));
    item.append(el("span", "code", alert.code), el("span", "when", formatWhen(alert.t)), el("div", "", alert.message));
    return item;
  }));
  if (astronaut.alerts.length === 0) panel.alerts.replaceChildren(el("li", "empty", "No alerts received yet."));

  // daily summaries, newest first
  panel.summariesTitle.textContent = "Daily summaries (" + astronaut.summaries.length + ")";
  panel.summaries.replaceChildren(...astronaut.summaries.map((summary) => {
    const item = el("li", "summary");
    item.append(el("span", "when", formatWhen(summary.t)), el("div", "", summary.text));
    return item;
  }));
  if (astronaut.summaries.length === 0) panel.summaries.replaceChildren(el("li", "empty", "No daily summaries received yet."));

  // lab results typed in at the MedVital station, newest first
  panel.labsTitle.textContent = "Onboard lab results (" + astronaut.labs.length + ")";
  panel.labs.replaceChildren(...astronaut.labs.map((lab) => {
    const item = el("li", "summary");
    item.append(el("span", "when", formatWhen(lab.t)), el("div", "", lab.text));
    return item;
  }));
  if (astronaut.labs.length === 0) panel.labs.replaceChildren(el("li", "empty", "No lab results received yet."));

  // readings the spacecraft's double-check flagged (possible sensor glitches) are saved but not charted
  panel.flagged.textContent = astronaut.flagged
    ? astronaut.flagged + " reading(s) flagged by the spacecraft's double-check (possible sensor glitch): saved, not charted."
    : "";
}

// ---------- refresh loop ----------
async function refresh() {
  if (busy) return;   // the last refresh is still running
  busy = true;
  try {
    const [link, stats, record] = await Promise.all([getJson("/link"), getJson("/stats"), getJson("/records")]);
    drawLink(link.up);
    drawCounts(stats);

    const container = document.getElementById("astronauts");
    for (const astronaut of record.astronauts) {
      if (!panels[astronaut.id]) {
        panels[astronaut.id] = makePanel(astronaut.id);
        container.append(panels[astronaut.id].section);
      }
      drawAstronaut(panels[astronaut.id], astronaut);
    }
    // An astronaut that is no longer in the record (database was reset) loses its panel.
    for (const id of Object.keys(panels)) {
      if (!record.astronauts.some((a) => a.id === id)) {
        if (panels[id].chart) panels[id].chart.destroy();
        panels[id].section.remove();
        delete panels[id];
      }
    }
    showNotice(record.astronauts.length === 0 ? "No records yet. They appear here as soon as the spacecraft syncs." : "");
  } catch (error) {
    showNotice("Cannot reach the NASA receiver. Is the NASA receiver (python start.py) still running? Trying again every few seconds.");
  } finally {
    busy = false;
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
