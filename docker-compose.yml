# Local PostgreSQL for the (not yet implemented) Postgres repository.
# STATUS: untested — Docker was not available on the build machine. Not needed for v0.1:
# the backend defaults to MEDVITAL_REPOSITORY=memory.
#
#   docker compose up -d db
#   psql postgresql://medvital:$POSTGRES_PASSWORD@localhost:5432/medvital -f backend/medvital/db/schema.sql
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: medvital
      POSTGRES_DB: medvital
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
