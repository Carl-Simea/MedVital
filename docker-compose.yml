# Local development database only. The credentials below are throwaway dev values.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: medvital
      POSTGRES_PASSWORD: medvital
      POSTGRES_DB: medvital
    ports:
      - "5432:5432"
    volumes:
      - medvital-pgdata:/var/lib/postgresql/data

volumes:
  medvital-pgdata:
