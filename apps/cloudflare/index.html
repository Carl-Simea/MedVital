<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spacecraft hub · MedVital</title>
<link rel="icon" href="/body/icon-180.png">
<link rel="stylesheet" href="/apps/shared/base.css">
<link rel="stylesheet" href="cloudflare.css">
</head>
<body>
<header class="bar">
  <div class="title">
    <h1>Spacecraft hub</h1>
    <p>Every wearable talks to the spacecraft through one private network. Click any box to see inside it.</p>
  </div>
  <div class="mission">
    <div class="clock"><b id="clockDay">Day –</b> <span id="clockTime">--:--</span></div>
    <div class="phase" id="clockPhase">–</div>
    <div class="dayline" aria-hidden="true"><i id="dayFill"></i></div>
    <div class="next" id="nextSend">Next send to NASA: end of the day</div>
  </div>
  <div class="link-box">
    <span id="linkState" class="link-state">Link to Earth: …</span>
    <button id="linkBtn" class="link-btn" disabled>…</button>
  </div>
</header>

<main class="main">
  <section class="schematic" aria-label="Live network">
    <svg id="net" viewBox="0 0 1000 520" role="img" aria-label="Wearables, private network, spacecraft systems, link to Earth, NASA">
      <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#2c5d8c" stroke-width="0.6"/></pattern></defs>
      <rect width="1000" height="520" fill="url(#grid)"/>
      <rect x="215" y="16" width="560" height="490" rx="12" class="cf-zone"/>
      <text x="232" y="40" class="zone-label">Cloudflare on the spacecraft</text>
      <g id="edges"></g><g id="nodes"></g><g id="packets"></g>
    </svg>
    <div class="dayend" id="dayend" hidden></div>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<script type="module" src="cloudflare.js"></script>
</body>
</html>
